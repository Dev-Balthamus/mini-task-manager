version: "1.3.0"
name: mini-task-manager
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    environment:
      - VITE_API_URL=http://localhost:3000/api/tasks
    ports:
      - 5173:5173
    depends_on:
      - backend
  backend:
    build:
      context: ./backend
      dockerfile: backend.Dockerfile
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    ports:
      - 3000:3000
    depends_on:
      db:
        condition: service_healthy
  db:
    container_name: ${DB_CONTAINER_NAME}
    image: postgres:18.4-alpine
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - ${DB_PORT}:5432
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
